[package]
name = "tui_arpg"
version = "0.1.0"
edition = "2021"
description = "A TUI demo for the Obelisk ARPG mechanics crates"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Obelisk crates
loot_core = { git = "https://github.com/LukeThayer/Obelisk" }
stat_core = { git = "https://github.com/LukeThayer/Obelisk" }
tables_core = { git = "https://github.com/LukeThayer/Obelisk" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# Utilities
anyhow = "1.0"
rand = "0.8"
