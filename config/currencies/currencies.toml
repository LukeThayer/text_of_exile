# Currency definitions for loot_core

[[currencies]]
id = "orb_of_transmutation"
name = "Orb of Transmutation"
description = "Upgrades a normal item to magic"
category = "Rarity"

[currencies.requires]
rarities = ["normal"]

[currencies.effects]
set_rarity = "magic"
add_affixes = { min = 1, max = 2 }
affix_pools = ["weapon_pool", "armour_pool"]

[[currencies]]
id = "orb_of_augmentation"
name = "Orb of Augmentation"
description = "Adds a modifier to a magic item"
category = "Affixes"

[currencies.requires]
rarities = ["magic"]
has_affix_slot = true

[currencies.effects]
add_affixes = { min = 1, max = 1 }
affix_pools = ["weapon_pool", "armour_pool"]

[[currencies]]
id = "orb_of_alteration"
name = "Orb of Alteration"
description = "Rerolls modifiers on a magic item"
category = "Affixes"

[currencies.requires]
rarities = ["magic"]

[currencies.effects]
clear_affixes = true
add_affixes = { min = 1, max = 2 }
affix_pools = ["weapon_pool", "armour_pool"]

[[currencies]]
id = "orb_of_alchemy"
name = "Orb of Alchemy"
description = "Upgrades a normal item to rare"
category = "Rarity"

[currencies.requires]
rarities = ["normal"]

[currencies.effects]
set_rarity = "rare"
add_affixes = { min = 3, max = 6 }
affix_pools = ["weapon_pool", "armour_pool"]

[[currencies]]
id = "chaos_orb"
name = "Chaos Orb"
description = "Rerolls all modifiers on a rare item"
category = "Affixes"

[currencies.requires]
rarities = ["rare"]

[currencies.effects]
clear_affixes = true
add_affixes = { min = 3, max = 6 }
affix_pools = ["weapon_pool", "armour_pool"]
